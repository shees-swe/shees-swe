<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Shees — Full-Stack Developer</title>
  <desc id="desc">A dark burgundy and orange GitHub profile header with a code mark, fine grid, flowing energy lines, and a subtle code terminal illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100C08"/>
      <stop offset="0.52" stop-color="#1B090D"/>
      <stop offset="1" stop-color="#100C08"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#95122C"/>
      <stop offset="0.52" stop-color="#CA3F16"/>
      <stop offset="1" stop-color="#FF9408"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9408"/>
      <stop offset="1" stop-color="#CA3F16"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBE0E1"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0.22" cy="0.48" r="0.65">
      <stop offset="0" stop-color="#95122C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#95122C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0.82" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#CA3F16" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#CA3F16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DBE0E1" stroke-opacity="0.065" stroke-width="0.7"/>
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.05" fill="#FF9408" fill-opacity="0.6"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="canvas"><rect width="1200" height="200" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="200" fill="url(#bg)"/>
    <rect width="1200" height="200" fill="url(#leftGlow)"/>
    <rect width="1200" height="200" fill="url(#rightGlow)"/>
    <rect width="1200" height="200" fill="url(#grid)"/>

    <!-- Ambient geometry -->
    <circle cx="98" cy="99" r="82" fill="none" stroke="#95122C" stroke-width="1.1" stroke-opacity="0.6"/>
    <circle cx="98" cy="99" r="68" fill="none" stroke="#CA3F16" stroke-width="0.8" stroke-dasharray="2 7" stroke-opacity="0.55"/>
    <path d="M0 48H45L65 28H113M0 161H40L58 179H117" fill="none" stroke="#FF9408" stroke-opacity="0.25" stroke-width="1"/>
    <path d="M158 36H186L202 52V78" fill="none" stroke="#CA3F16" stroke-opacity="0.38" stroke-width="1"/>
    <circle cx="45" cy="48" r="2.2" fill="#FF9408" filter="url(#softGlow)"/>
    <circle cx="113" cy="28" r="2" fill="#CA3F16"/>
    <circle cx="117" cy="179" r="2" fill="#FF9408"/>

    <!-- Code mark -->
    <g transform="translate(98 100)" filter="url(#shadow)">
      <path d="M-18 -25L-44 0L-18 25M18 -25L44 0L18 25M7 -37L-7 37" fill="none" stroke="url(#hot)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#DBE0E1" stroke-opacity="0.08" stroke-width="1"/>
    </g>

    <!-- Name and role -->
    <g>
      <text x="225" y="74" fill="url(#cream)" font-family="Poppins, Inter, 'Segoe UI', sans-serif" font-size="37" font-weight="700" letter-spacing="-0.8">Muhammad Shees</text>
      <rect x="227" y="91" width="42" height="3" rx="1.5" fill="url(#hot)"/>
      <text x="281" y="103" fill="url(#textAccent)" font-family="Poppins, Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="3.1">FULL-STACK DEVELOPER</text>
      <text x="227" y="128" fill="#DBE0E1" fill-opacity="0.88" font-family="Poppins, Inter, 'Segoe UI', sans-serif" font-size="10.6" font-weight="500" letter-spacing="1.35">WEB APPLICATIONS  ·  SOFTWARE ENGINEERING</text>
      <path d="M227 145H685" stroke="#DBE0E1" stroke-opacity="0.11" stroke-width="1"/>
      <text x="227" y="163" fill="#DBE0E1" fill-opacity="0.55" font-family="Poppins, Inter, 'Segoe UI', sans-serif" font-size="9.5" font-weight="400" letter-spacing="1.7">DESIGNING • BUILDING • SHIPPING</text>
    </g>

    <!-- Stylized terminal card -->
    <g transform="translate(846 32)" filter="url(#shadow)">
      <rect x="0" y="0" width="222" height="116" rx="10" fill="#160D11" fill-opacity="0.88" stroke="#95122C" stroke-opacity="0.7" stroke-width="1.1"/>
      <path d="M1 32H221" stroke="#95122C" stroke-opacity="0.55" stroke-width="1"/>
      <circle cx="16" cy="16" r="3" fill="#95122C"/>
      <circle cx="27" cy="16" r="3" fill="#CA3F16"/>
      <circle cx="38" cy="16" r="3" fill="#FF9408"/>
      <text x="55" y="20" fill="#DBE0E1" fill-opacity="0.65" font-family="Poppins, Inter, sans-serif" font-size="8" letter-spacing="1.1">SHEES.DEV / TERMINAL</text>
      <text x="16" y="54" fill="#FF9408" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="9">&gt;</text>
      <rect x="29" y="47" width="88" height="4" rx="2" fill="#F3F4F5" fill-opacity="0.82"/>
      <rect x="124" y="47" width="37" height="4" rx="2" fill="#CA3F16" fill-opacity="0.95"/>
      <text x="16" y="72" fill="#CA3F16" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="9">&gt;</text>
      <rect x="29" y="65" width="51" height="4" rx="2" fill="#FF9408" fill-opacity="0.9"/>
      <rect x="87" y="65" width="77" height="4" rx="2" fill="#DBE0E1" fill-opacity="0.36"/>
      <text x="16" y="90" fill="#FF9408" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="9">&gt;</text>
      <rect x="29" y="83" width="65" height="4" rx="2" fill="#CA3F16" fill-opacity="0.8"/>
      <rect x="101" y="83" width="36" height="4" rx="2" fill="#F3F4F5" fill-opacity="0.6"/>
      <rect x="16" y="99" width="190" height="1" fill="#DBE0E1" fill-opacity="0.12"/>
      <circle cx="193" cy="16" r="2" fill="#FF9408" filter="url(#softGlow)"/>
    </g>

    <!-- Stack labels and connecting paths -->
    <g font-family="Poppins, Inter, 'Segoe UI', sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.7">
      <path d="M1068 60H1091V43H1110M1068 91H1095V112H1110M1091 43H1142M1095 112H1142" fill="none" stroke="url(#hot)" stroke-opacity="0.75" stroke-width="1.1"/>
      <circle cx="1091" cy="60" r="2.2" fill="#FF9408"/>
      <circle cx="1095" cy="91" r="2.2" fill="#CA3F16"/>
      <rect x="1110" y="31" width="70" height="24" rx="6" fill="#1B0D11" stroke="#CA3F16" stroke-opacity="0.65"/>
      <text x="1145" y="46" fill="#F3F4F5" text-anchor="middle">REACT</text>
      <rect x="1110" y="100" width="70" height="24" rx="6" fill="#1B0D11" stroke="#95122C" stroke-opacity="0.8"/>
      <text x="1145" y="115" fill="#FF9408" text-anchor="middle">NODE.JS</text>
      <circle cx="1142" cy="43" r="2" fill="#FF9408" filter="url(#softGlow)"/>
      <circle cx="1142" cy="112" r="2" fill="#CA3F16" filter="url(#softGlow)"/>
    </g>

    <!-- Flowing warm light waves across lower edge -->
    <path d="M0 161C119 125 174 194 298 162S485 135 614 164 842 190 977 159 1090 146 1200 164" fill="none" stroke="#95122C" stroke-width="7" stroke-opacity="0.19"/>
    <path d="M0 161C119 125 174 194 298 162S485 135 614 164 842 190 977 159 1090 146 1200 164" fill="none" stroke="url(#hot)" stroke-width="1.4" stroke-opacity="0.82"/>
    <path d="M0 175C142 144 218 198 340 175S539 159 680 179 887 196 1025 177 1139 163 1200 174" fill="none" stroke="#CA3F16" stroke-width="1" stroke-opacity="0.55"/>
    <path d="M0 188C145 164 241 202 370 187S585 173 727 189 930 202 1068 189 1150 182 1200 187" fill="none" stroke="#FF9408" stroke-width="0.7" stroke-opacity="0.28"/>
    <g fill="#FF9408" filter="url(#softGlow)">
      <circle cx="175" cy="181" r="2.4"/><circle cx="485" cy="157" r="2.1"/><circle cx="741" cy="186" r="2.2"/><circle cx="1012" cy="168" r="2.2"/>
    </g>

    <!-- Tiny pixel fields add texture without clutter -->
    <rect x="742" y="17" width="54" height="31" fill="url(#dots)" opacity="0.55"/>
    <rect x="1105" y="147" width="70" height="22" fill="url(#dots)" opacity="0.48"/>
    <path d="M0 1H1200" stroke="#FF9408" stroke-opacity="0.45" stroke-width="1"/>
  </g>
</svg>
